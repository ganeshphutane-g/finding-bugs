name: wgresolve

on:
  push:
    paths: ["projects/wgresolve/**", ".github/workflows/wgresolve.yml"]
  pull_request:
    paths: ["projects/wgresolve/**", ".github/workflows/wgresolve.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/wgresolve

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: projects/wgresolve/go.mod
          cache-dependency-path: projects/wgresolve/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: cross-builds
        run: |
          for target in linux/amd64 linux/arm64 linux/arm/7 linux/386 linux/mips/softfloat; do
            IFS=/ read -r os arch arm <<< "$target"
            if [ "$arch" = mips ]; then GOMIPS=$arm; arm=; fi
            GOOS=$os GOARCH=$arch GOARM=$arm GOMIPS=${GOMIPS:-} go build -o /dev/null . || exit 1
          done
      - name: unit tests
        run: go test -race -count=1 ./...
      - name: tools for the end-to-end tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q wireguard-tools dnsmasq-base nftables
          GOBIN=/tmp/wg-bin go install golang.zx2c4.com/wireguard@v0.0.0-20261006164505-2631ce99a06f
          sudo ln -sf /tmp/wg-bin/wireguard /usr/local/bin/wireguard-go
          sudo modprobe wireguard && echo "kernel WireGuard" || echo "wireguard-go"
      - name: end to end with real WireGuard in network namespaces
        run: |
          go build -o /tmp/wgresolve .
          go test -c -race -o /tmp/e2e.test ./internal/e2e
          cd internal/e2e && sudo WGRESOLVE_INTEGRATION=1 WGRESOLVE_BIN=/tmp/wgresolve /tmp/e2e.test -test.v -test.timeout 20m
      - name: the Docker image builds and runs
        run: |
          docker build -t wgresolve:ci --build-arg VERSION=ci .
          docker run --rm wgresolve:ci version
