name: tsdirect

on:
  push:
    paths: ["projects/tsdirect/**", ".github/workflows/tsdirect.yml"]
  pull_request:
    paths: ["projects/tsdirect/**", ".github/workflows/tsdirect.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/tsdirect

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: projects/tsdirect/go.mod
          cache-dependency-path: projects/tsdirect/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: cross-builds
        run: |
          for target in linux/amd64 linux/arm64 linux/arm/7 linux/386 linux/mips/softfloat linux/riscv64; do
            IFS=/ read -r os arch arm <<< "$target"
            if [ "$arch" = mips ]; then GOMIPS=$arm; arm=; fi
            GOOS=$os GOARCH=$arch GOARM=$arm GOMIPS=${GOMIPS:-} go build -o /dev/null . || exit 1
          done
      - name: unit tests
        run: go test -race -count=1 ./...
      - name: Tailscale and headscale for the end-to-end tests
        # tailscale 1.104 needs a newer Go than tsdirect; GOTOOLCHAIN=auto
        # fetches it.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nftables
          GOTOOLCHAIN=auto GOBIN=/tmp/ts-bin go install tailscale.com/cmd/tailscale@v1.104.2 tailscale.com/cmd/tailscaled@v1.104.2
          GOTOOLCHAIN=auto GOBIN=/tmp/ts-bin go install github.com/juanfont/headscale/cmd/headscale@v0.29.5
          /tmp/ts-bin/tailscale version
      - name: end to end with headscale and tailscaled in network namespaces
        run: |
          go build -o /tmp/tsdirect .
          go test -c -race -o /tmp/e2e.test ./internal/e2e
          cd internal/e2e && sudo PATH=/tmp/ts-bin:$PATH TSDIRECT_INTEGRATION=1 TSDIRECT_BIN=/tmp/tsdirect /tmp/e2e.test -test.v -test.timeout 15m
