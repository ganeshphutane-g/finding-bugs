name: pushprobe

on:
  push:
    paths: ["projects/pushprobe/**", ".github/workflows/pushprobe.yml"]
  pull_request:
    paths: ["projects/pushprobe/**", ".github/workflows/pushprobe.yml"]

defaults:
  run:
    working-directory: projects/pushprobe

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: projects/pushprobe/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: cross-builds
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null . || exit 1
          done
      - name: tests, also against real Uptime Kuma and Gatus servers
        run: PUSHPROBE_INTEGRATION=1 go test -race -count=1 -timeout 20m ./...
      - name: the Docker image builds and runs
        run: |
          docker build -t pushprobe:ci --build-arg VERSION=ci .
          docker run --rm pushprobe:ci version
